[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advantek-forecast"
version = "0.1.0"
description = "Day-ahead hourly load forecasting for the Advantek assignment"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "lightgbm>=4.0.0",
    "optuna>=3.4.0",
    "scikit-learn>=1.3.0",
    "holidays>=0.45",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]